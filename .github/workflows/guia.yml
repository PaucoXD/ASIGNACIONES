name: Explorar guía (prueba)
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/explorar-guia.mjs", ".github/workflows/guia.yml"]
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/explorar-guia.mjs 202609
