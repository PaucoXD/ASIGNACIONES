<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privilegios Cong. Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: form column + live image preview; stacks to one column on phones */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5a6876;
  --line: #d5dce3;
  --accent: #1f5f7a;
  --accent-fg: #ffffff;
  --danger: #a63d3d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #1a232c; --fg: #e6ecf1; --muted: #9aa8b5;
    --line: #2c3945; --accent: #5fa9c7; --accent-fg: #0d1a21; --danger: #e07a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #1a232c; --fg: #e6ecf1; --muted: #9aa8b5;
  --line: #2c3945; --accent: #5fa9c7; --accent-fg: #0d1a21; --danger: #e07a7a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.45 var(--body);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
header.top { max-width: 1100px; margin: 0 auto 18px; }
h1 { font: 800 1.7rem/1.1 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 16px; min-width: 0; }
.panel h2 { font: 600 .78rem/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 500; }
input, select, textarea {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 11px; width: 100%; min-width: 0;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 120px; }
button {
  font: 600 .95rem var(--body); border-radius: 9px; padding: 10px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 6px; align-items: center; }
.row .del { padding: 8px 11px; color: var(--danger); background: transparent; }
.rows-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 42px; gap: 6px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1 1 150px; }
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.preview img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; background: var(--bg); }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.toast { min-height: 1.2em; font-size: .85rem; color: var(--accent); margin: 0; }
@media (prefers-reduced-motion: no-preference) { button { transition: filter .15s; } button:hover { filter: brightness(1.08); } }
</style>
</head>
<body>
<header class="top">
  <h1>Privilegios de la reunión</h1>
  <p class="sub">Llena los nombres y comparte la imagen en el grupo.</p>
</header>

<div class="wrap">
  <form class="panel" id="form" autocomplete="off">
    <h2>Reunión</h2>
    <div class="seg" role="group" aria-label="Tipo de reunión">
      <button type="button" id="t-semana" data-tipo="semana">Entre semana</button>
      <button type="button" id="t-finde" data-tipo="finde">Fin de semana</button>
    </div>
    <div class="grid2">
      <label class="f">Congregación<input id="cong" value="Congregación Portal"></label>
      <label class="f">Fecha<input id="fecha" type="date"></label>
      <label class="f">Hora<input id="hora" type="time"></label>
    </div>

    <h2>Asignaciones</h2>
    <div class="rows-head"><span>Privilegio</span><span>Hermano</span><span></span></div>
    <div class="rows" id="rows"></div>
    <div class="actions">
      <button type="button" id="add">+ Agregar privilegio</button>
      <button type="button" id="reset">Restablecer lista</button>
    </div>

    <label class="f">Mensaje final<input id="msg" value="Nos vemos en un rato más, primero Jehová"></label>
    <datalist id="nombres"></datalist>
    <datalist id="privs"></datalist>
  </form>

  <section class="panel preview" aria-label="Vista previa">
    <h2>Imagen</h2>
    <img id="out" alt="Imagen de privilegios generada">
    <div class="actions">
      <button type="button" class="primary" id="share">Compartir</button>
      <button type="button" id="download">Descargar</button>
      <button type="button" id="copytext">Copiar texto</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
    <p class="hint">Si un botón no funciona en tu teléfono, mantén presionada la imagen para guardarla o compartirla.</p>
  </section>
</div>

<canvas id="cv" hidden></canvas>

<script>
const PRESETS = {
  semana: [
    ["Presidente sala A", ""],
    ["Sala B", ""],
    ["Puerta de entrada", ""],
    ["Sala", ""],
    ["Sala", ""],
    ["Micrófono", ""],
    ["Micrófono", ""],
    ["Aseo", "Grupo 1"],
  ],
  finde: [
    ["Presidente", ""],
    ["Lector de La Atalaya", ""],
    ["Puerta de entrada", ""],
    ["Sala", ""],
    ["Sala", ""],
    ["Micrófono", ""],
    ["Micrófono", ""],
    ["Aseo", "Grupo 1"],
  ],
};
const TITULOS = { semana: "Reunión de entre semana", finde: "Reunión del fin de semana" };
const PRIVS = ["Presidente", "Presidente sala A", "Sala B", "Lector de La Atalaya", "Puerta de entrada", "Sala", "Micrófono", "Audio y video", "Plataforma", "Aseo", "Conductor de La Atalaya", "Oración"];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let state = store.get("priv-state", null);
if (!state) {
  const finde = [0, 6].includes(new Date().getDay());
  state = { tipo: finde ? "finde" : "semana", rows: PRESETS[finde ? "finde" : "semana"].map(r => [...r]) };
}
let nombres = store.get("priv-nombres", ["Tomás Reyes", "Eliezer Gzz", "Roberto Belmares", "Ulises Alonso", "Alfonso Vázquez", "Mateo Luna"]);

function nextMeetingDate(tipo) {
  const d = new Date();
  // Entre semana: jueves; fin de semana: domingo (ajustable en el formulario)
  const target = tipo === "finde" ? 0 : 4;
  while (d.getDay() !== target) d.setDate(d.getDate() + 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function fillLists() {
  $("nombres").innerHTML = nombres.map(n => `<option value="${esc(n)}">`).join("");
  $("privs").innerHTML = PRIVS.map(n => `<option value="${esc(n)}">`).join("");
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderRows() {
  const box = $("rows");
  box.innerHTML = "";
  state.rows.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input id="p-${i}" list="privs" aria-label="Privilegio ${i + 1}" value="${esc(r[0])}">
      <input id="n-${i}" list="nombres" aria-label="Hermano para ${esc(r[0] || "privilegio")}" placeholder="Nombre" value="${esc(r[1])}">
      <button type="button" class="del" aria-label="Quitar">✕</button>`;
    row.querySelector(`#p-${i}`).addEventListener("input", e => { state.rows[i][0] = e.target.value; changed(); });
    row.querySelector(`#n-${i}`).addEventListener("input", e => { state.rows[i][1] = e.target.value; changed(); });
    row.querySelector(`#n-${i}`).addEventListener("change", e => rememberName(e.target.value));
    row.querySelector(".del").addEventListener("click", () => { state.rows.splice(i, 1); renderRows(); changed(); });
    box.appendChild(row);
  });
}
function rememberName(n) {
  n = n.trim();
  if (n && !nombres.includes(n)) { nombres.push(n); nombres.sort((a, b) => a.localeCompare(b, "es")); store.set("priv-nombres", nombres); fillLists(); }
}

function setTipo(tipo, resetRows) {
  state.tipo = tipo;
  if (resetRows) state.rows = PRESETS[tipo].map(r => [...r]);
  $("t-semana").setAttribute("aria-pressed", tipo === "semana");
  $("t-finde").setAttribute("aria-pressed", tipo === "finde");
  if (resetRows) { $("fecha").value = nextMeetingDate(tipo); $("hora").value = tipo === "finde" ? "17:00" : "19:30"; }
  renderRows();
  changed();
}

function fechaLarga() {
  const v = $("fecha").value;
  if (!v) return "";
  const [y, m, d] = v.split("-").map(Number);
  const s = new Date(y, m - 1, d).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function horaTxt() {
  const v = $("hora").value;
  if (!v) return "";
  let [h, m] = v.split(":").map(Number);
  const ap = h >= 12 ? "p. m." : "a. m.";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}

// ---------- Dibujo de la imagen ----------
const W = 1080;
const C = { bg: "#f4f7f9", head: "#1f5f7a", headDeep: "#163f52", headFg: "#ffffff", soft: "#cfe3ec", label: "#1f5f7a", name: "#17212b", line: "#dbe3e9", muted: "#5a6876", empty: "#a3b0bb" };

function fitText(ctx, text, maxW, size, weight, family, min = 28) {
  let s = size;
  ctx.font = `${weight} ${s}px ${family}`;
  while (ctx.measureText(text).width > maxW && s > min) { s -= 2; ctx.font = `${weight} ${s}px ${family}`; }
  return s;
}

function draw() {
  const cv = $("cv"), ctx = cv.getContext("2d");
  const rows = state.rows.filter(r => r[0].trim() || r[1].trim());
  const headH = 330, rowH = 118, footH = 170, pad = 72;
  const H = Math.max(1080, headH + 40 + rows.length * rowH + footH);
  cv.width = W; cv.height = H;
  const DISP = '"Bricolage Grotesque", sans-serif', BODY = '"Figtree", sans-serif';

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  // Encabezado
  const g = ctx.createLinearGradient(0, 0, W, headH);
  g.addColorStop(0, C.head); g.addColorStop(1, C.headDeep);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, headH);
  ctx.fillStyle = "rgba(255,255,255,.06)";
  ctx.beginPath(); ctx.arc(W - 40, 40, 230, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 120, headH + 10, 120, 0, Math.PI * 2); ctx.fill();

  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.soft;
  ctx.font = `600 30px ${BODY}`;
  ctx.fillText(($("cong").value || "").toUpperCase().split("").join(String.fromCharCode(8202)), pad, 92);
  ctx.fillStyle = C.headFg;
  ctx.font = `800 104px ${DISP}`;
  ctx.fillText("Privilegios", pad, 196);
  ctx.font = `500 36px ${BODY}`;
  ctx.fillStyle = C.soft;
  const sub = [TITULOS[state.tipo], fechaLarga(), horaTxt()].filter(Boolean).join("  ·  ");
  fitText(ctx, sub, W - pad * 2, 36, 500, BODY, 24);
  ctx.fillText(sub, pad, 262);

  // Filas
  let y = headH + 40;
  const labelW = 400;
  rows.forEach((r, i) => {
    if (i > 0) { ctx.fillStyle = C.line; ctx.fillRect(pad, y, W - pad * 2, 2); }
    const mid = y + rowH / 2;
    ctx.textBaseline = "middle";
    ctx.fillStyle = C.label;
    const lab = r[0].trim().toUpperCase();
    fitText(ctx, lab, labelW - 24, 28, 700, BODY, 18);
    ctx.fillText(lab, pad, mid);
    const nm = r[1].trim();
    ctx.fillStyle = nm ? C.name : C.empty;
    const show = nm || "Por asignar";
    fitText(ctx, show, W - pad * 2 - labelW, 46, nm ? 600 : 500, nm ? DISP : BODY, 26);
    ctx.fillText(show, pad + labelW, mid);
    y += rowH;
  });

  // Pie
  const msg = $("msg").value.trim();
  if (msg) {
    ctx.textBaseline = "middle";
    ctx.fillStyle = C.head;
    const fy = H - footH / 2;
    ctx.fillRect(pad, H - footH + 10, 64, 6);
    ctx.fillStyle = C.muted;
    fitText(ctx, msg, W - pad * 2, 36, 500, BODY, 22);
    ctx.fillText(msg, pad, fy + 10);
  }
  $("out").src = cv.toDataURL("image/png");
}

let t;
function changed() {
  store.set("priv-state", state);
  clearTimeout(t); t = setTimeout(draw, 120);
}

function textoWhatsApp() {
  const lines = [`*Privilegios — ${TITULOS[state.tipo]}*`];
  const f = [fechaLarga(), horaTxt()].filter(Boolean).join(", ");
  if (f) lines.push(f);
  lines.push("");
  state.rows.filter(r => r[0].trim() || r[1].trim()).forEach(r => lines.push(`${r[0].trim()}: ${r[1].trim() || "Por asignar"}`));
  const msg = $("msg").value.trim();
  if (msg) lines.push("", msg);
  return lines.join("\n");
}

function toast(s) { $("toast").textContent = s; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").textContent = "", 3500); }
function fileName() { return `privilegios-${$("fecha").value || "reunion"}.png`; }

async function getBlob() { return new Promise(res => $("cv").toBlob(res, "image/png")); }

$("share").addEventListener("click", async () => {
  draw();
  try {
    const file = new File([await getBlob()], fileName(), { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: textoWhatsApp() });
      toast("Listo para enviar.");
    } else {
      toast("Este navegador no permite compartir. Usa Descargar o mantén presionada la imagen.");
    }
  } catch (e) { if (e.name !== "AbortError") toast("No se pudo compartir. Mantén presionada la imagen para guardarla."); }
});
$("download").addEventListener("click", async () => {
  draw();
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: fileName(), data: await getBlob() }); toast("Imagen guardada."); }
    catch (e) { if (e?.code !== "declined") toast("No se pudo descargar. Mantén presionada la imagen para guardarla."); }
    return;
  }
  const a = document.createElement("a");
  a.href = $("cv").toDataURL("image/png"); a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
  toast("Descarga iniciada. Si no aparece, mantén presionada la imagen.");
});
$("copytext").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(textoWhatsApp()); toast("Texto copiado. Pégalo en WhatsApp."); }
  catch { toast("No se pudo copiar automáticamente."); }
});
$("add").addEventListener("click", () => { state.rows.push(["", ""]); renderRows(); changed(); $(`p-${state.rows.length - 1}`).focus(); });
$("reset").addEventListener("click", () => setTipo(state.tipo, true));
$("t-semana").addEventListener("click", () => setTipo("semana", true));
$("t-finde").addEventListener("click", () => setTipo("finde", true));
["cong", "fecha", "hora", "msg"].forEach(id => $(id).addEventListener("input", () => {
  state[id] = $(id).value; changed();
}));
$("form").addEventListener("submit", e => e.preventDefault());

// Inicio
["cong", "msg", "fecha", "hora"].forEach(id => { if (state[id]) $(id).value = state[id]; });
if (!$("fecha").value) $("fecha").value = nextMeetingDate(state.tipo);
if (!$("hora").value) $("hora").value = state.tipo === "finde" ? "17:00" : "19:30";
fillLists();
setTipo(state.tipo, false);
draw();
if (document.fonts) Promise.all([
  '800 104px "Bricolage Grotesque"', '600 46px "Bricolage Grotesque"',
  '500 36px "Figtree"', '600 30px "Figtree"', '700 28px "Figtree"',
].map(f => document.fonts.load(f))).then(draw, draw);
</script>
</body>
</html>
